<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slide 19 - State Chart Diagram</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #0B1120;
        }
        .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Grid Pattern */
        .bg-grid {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* Diagram Box Styling */
        .diag-box {
            background-color: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(71, 85, 105, 0.6);
            backdrop-filter: blur(4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 9999px; /* Rounded pill/circle for states */
            z-index: 20;
        }
        .diag-box:hover {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
            transform: translateY(-2px);
        }
        
        /* State Colors */
        .state-idle { border-color: rgba(148, 163, 184, 0.5); background-color: rgba(30, 41, 59, 0.8); }
        .state-scanning { border-color: rgba(59, 130, 246, 0.6); background-color: rgba(30, 58, 138, 0.3); }
        .state-analyzing { border-color: rgba(245, 158, 11, 0.6); background-color: rgba(120, 53, 15, 0.3); }
        .state-report { border-color: rgba(139, 92, 246, 0.6); background-color: rgba(76, 29, 149, 0.3); }
        .state-completed { border-color: rgba(16, 185, 129, 0.6); background-color: rgba(6, 78, 59, 0.3); }
        
        /* Start/End Nodes */
        .node-start {
            width: 24px;
            height: 24px;
            background-color: #10b981;
            border-radius: 50%;
            border: 2px solid #065f46;
            z-index: 20;
            position: absolute;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .node-end {
            width: 24px;
            height: 24px;
            background-color: transparent;
            border-radius: 50%;
            border: 2px solid #ef4444;
            z-index: 20;
            position: absolute;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .node-end-inner {
            width: 14px;
            height: 14px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        /* Connection Lines (SVG) */
        .connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Transition Labels */
        .transition-label {
            position: absolute;
            background-color: #0f172a;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #94a3b8;
            border: 1px solid #334155;
            z-index: 15;
            white-space: nowrap;
        }

        /* Flow Animation */
        @keyframes flowPulse {
            0% { stroke-dashoffset: 20; opacity: 0.6; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }
        .flow-line {
            stroke-dasharray: 5;
            animation: flowPulse 3s linear infinite;
        }
    </style>
</head>
<body class="w-[1280px] h-[720px] text-white bg-grid relative flex flex-col">
<!-- Header Area -->
<header class="relative z-30 px-16 pt-12 pb-4 flex justify-between items-end border-b border-gray-800 bg-opacity-90 bg-[#0B1120]">
<div>
<div class="flex items-center space-x-2 mb-2">
<span class="w-2 h-2 bg-purple-500 rounded-full"></span>
<p class="text-purple-400 text-xs font-mono uppercase tracking-widest">UML Diagrams</p>
</div>
<h1 class="text-4xl font-heading font-bold text-white">State Chart Diagram</h1>
</div>
<div class="text-right">
<p class="text-gray-500 font-mono text-sm">System Lifecycle States</p>
</div>
</header>
<!-- Main Content / Diagram Area -->
<main class="relative z-10 flex flex-1 w-full h-full overflow-hidden bg-[#0B1120]">
<!-- SVG Connections Layer -->
<svg class="connections-layer">
<defs>
<marker id="arrowhead" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#94a3b8" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
<marker id="arrowhead-active" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#3b82f6" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- Start to Idle -->
<path d="M124 360 L180 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
<!-- Idle to Scanning -->
<path class="flow-line" d="M340 360 L440 360" marker-end="url(#arrowhead-active)" stroke="#3b82f6" stroke-width="2"></path>
<!-- Scanning to Analyzing -->
<path d="M600 360 L700 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
<!-- Analyzing to Report_Ready -->
<path d="M860 360 L960 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
<!-- Report_Ready to Completed -->
<path d="M1120 360 L1180 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
<!-- Loopback: Report_Ready to Idle (Reset) -->
<path d="M1040 400 Q 1040 500, 640 500 Q 260 500, 260 400" fill="none" marker-end="url(#arrowhead)" stroke="#475569" stroke-dasharray="4" stroke-width="1.5"></path>
</svg>
<!-- Diagram Container -->
<div class="relative w-full h-full flex items-center justify-center">
<!-- Start Node -->
<div class="node-start" style="left: 100px; top: 348px;"></div>
<!-- State: Idle -->
<div class="diag-box state-idle" style="left: 180px; top: 320px; width: 160px; height: 80px;">
<div class="flex items-center space-x-2">
<i class="fas fa-pause-circle text-gray-400"></i>
<h3 class="text-white font-bold text-sm uppercase tracking-wide">Idle</h3>
</div>
<p class="text-gray-400 text-[10px] mt-1">Waiting for input</p>
</div>
<!-- Transition Label: startScan -->
<div class="transition-label" style="left: 355px; top: 335px;">
            startScan()
        </div>
<!-- State: Scanning -->
<div class="diag-box state-scanning" style="left: 440px; top: 320px; width: 160px; height: 80px;">
<div class="flex items-center space-x-2">
<i class="fas fa-radar text-blue-400"></i>
<h3 class="text-white font-bold text-sm uppercase tracking-wide">Scanning</h3>
</div>
<p class="text-blue-200 text-[10px] mt-1">Tools Running</p>
</div>
<!-- Transition Label: scanDone -->
<div class="transition-label" style="left: 615px; top: 335px;">
            scanDone
        </div>
<!-- State: Analyzing -->
<div class="diag-box state-analyzing" style="left: 700px; top: 320px; width: 160px; height: 80px;">
<div class="flex items-center space-x-2">
<i class="fas fa-brain text-yellow-400"></i>
<h3 class="text-white font-bold text-sm uppercase tracking-wide">Analyzing</h3>
</div>
<p class="text-yellow-200 text-[10px] mt-1">Processing Data</p>
</div>
<!-- Transition Label: analysisDone -->
<div class="transition-label" style="left: 870px; top: 335px;">
            analysisDone
        </div>
<!-- State: Report_Ready -->
<div class="diag-box state-report" style="left: 960px; top: 320px; width: 160px; height: 80px;">
<div class="flex items-center space-x-2">
<i class="fas fa-file-contract text-purple-400"></i>
<h3 class="text-white font-bold text-sm uppercase tracking-wide">Report Ready</h3>
</div>
<p class="text-purple-200 text-[10px] mt-1">PDF Generated</p>
</div>
<!-- Loopback Label -->
<div class="transition-label" style="left: 600px; top: 505px;">
            reset() / newScan()
        </div>
<!-- End Node -->
<div class="node-end" style="left: 1180px; top: 348px;">
<div class="node-end-inner"></div>
</div>
<!-- Legend/Notes -->
<div class="absolute bottom-6 right-6 p-4 bg-gray-900 bg-opacity-80 border border-gray-700 rounded-lg w-64">
<h4 class="text-gray-400 text-xs font-bold uppercase mb-2">State Legend</h4>
<div class="space-y-2">
<div class="flex items-center">
<div class="w-3 h-3 bg-blue-500 bg-opacity-50 border border-blue-400 rounded-full mr-2"></div>
<p class="text-gray-300 text-xs">Active Process</p>
</div>
<div class="flex items-center">
<div class="w-3 h-3 bg-yellow-500 bg-opacity-50 border border-yellow-400 rounded-full mr-2"></div>
<p class="text-gray-300 text-xs">Data Processing</p>
</div>
<div class="flex items-center">
<div class="w-3 h-3 bg-purple-500 bg-opacity-50 border border-purple-400 rounded-full mr-2"></div>
<p class="text-gray-300 text-xs">Output State</p>
</div>
</div>
</div>
</div>
</main>
<!-- Footer Stripe -->
<div class="h-1 w-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
</body>
</html>
