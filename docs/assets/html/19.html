<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slide 19 - State Chart Diagram</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    /* 1. Viewport Reset */
    body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #050a14;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    /* 2. Scaler Wrapper */
    #scaler {
        transform-origin: center center;
        transition: transform 0.2s ease-out;
    }

    /* 3. Fixed Slide Container (1280x720) */
    #slide-container {
        position: relative;
        width: 1280px;
        height: 720px;
        background-color: #0B1120;
        box-shadow: 0 0 100px rgba(0,0,0,0.8);
        overflow: hidden;
    }

    .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Grid Pattern */
    .bg-grid {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        position: absolute; inset: 0; z-index: 0;
    }

    /* Diagram Box Styling */
    .diag-box {
        background-color: rgba(30, 41, 59, 0.9);
        border: 2px solid rgba(71, 85, 105, 0.6);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 9999px; /* Rounded pill */
        z-index: 20;
    }
    .diag-box:hover {
        border-color: rgba(16, 185, 129, 0.5);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        transform: translateY(-4px);
    }
    
    /* State Colors */
    .state-idle { border-color: rgba(148, 163, 184, 0.5); background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9)); }
    .state-scanning { border-color: rgba(59, 130, 246, 0.6); background: linear-gradient(145deg, rgba(30, 58, 138, 0.4), rgba(30, 41, 59, 0.9)); }
    .state-analyzing { border-color: rgba(245, 158, 11, 0.6); background: linear-gradient(145deg, rgba(120, 53, 15, 0.4), rgba(30, 41, 59, 0.9)); }
    .state-report { border-color: rgba(139, 92, 246, 0.6); background: linear-gradient(145deg, rgba(76, 29, 149, 0.4), rgba(30, 41, 59, 0.9)); }
    
    /* Start/End Nodes */
    .node-start {
        width: 32px;
        height: 32px;
        background-color: #10b981;
        border-radius: 50%;
        border: 4px solid #064e3b;
        z-index: 20;
        position: absolute;
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }
    .node-end {
        width: 32px;
        height: 32px;
        background-color: transparent;
        border-radius: 50%;
        border: 4px solid #ef4444;
        z-index: 20;
        position: absolute;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .node-end-inner {
        width: 16px;
        height: 16px;
        background-color: #ef4444;
        border-radius: 50%;
    }

    /* Connection Lines */
    svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 10;
        pointer-events: none;
    }
    
    /* Transition Labels */
    .transition-label {
        position: absolute;
        background-color: #0f172a;
        padding: 4px 10px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        color: #94a3b8;
        border: 1px solid #334155;
        z-index: 15;
        white-space: nowrap;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    /* Animations */
    @keyframes flowPulse {
        0% { stroke-dashoffset: 20; opacity: 0.5; }
        100% { stroke-dashoffset: 0; opacity: 1; }
    }
    .flow-line {
        stroke-dasharray: 6;
        animation: flowPulse 2s linear infinite;
    }
</style>
</head>
<body>

<div id="scaler">
    <div id="slide-container">
        
        <div class="bg-grid"></div>
        <div class="absolute top-0 right-0 w-1/2 h-full bg-blue-900 opacity-10 transform skew-x-12 origin-top-right translate-x-32 z-0"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-900 opacity-10 rounded-full filter blur-3xl z-0"></div>

        <header class="absolute top-0 left-0 w-full px-16 pt-10 pb-4 flex justify-between items-end border-b border-gray-800 bg-opacity-90 bg-[#0B1120] z-30 h-[100px]">
            <div>
                <div class="flex items-center space-x-2 mb-1">
                    <span class="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></span>
                    <p class="text-purple-400 text-xs font-mono uppercase tracking-widest">UML Diagrams</p>
                </div>
                <h1 class="text-4xl font-heading font-bold text-white">State Chart Diagram</h1>
            </div>
            <div class="text-right">
                <p class="text-gray-500 font-mono text-sm">System Lifecycle States</p>
            </div>
        </header>

        <main class="absolute top-0 left-0 w-full h-full z-10">
            
            <svg>
                <defs>
                    <marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
                        <polygon fill="#64748b" points="0 0, 10 3.5, 0 7"></polygon>
                    </marker>
                    <marker id="arrowhead-active" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
                        <polygon fill="#3b82f6" points="0 0, 10 3.5, 0 7"></polygon>
                    </marker>
                </defs>

                <path d="M124 360 L180 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
                
                <path class="flow-line" d="M340 360 L440 360" marker-end="url(#arrowhead-active)" stroke="#3b82f6" stroke-width="2"></path>
                
                <path d="M600 360 L700 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
                
                <path d="M860 360 L960 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
                
                <path d="M1120 360 L1180 360" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="2"></path>
                
                <path d="M1040 400 Q 1040 520, 640 520 Q 260 520, 260 400" fill="none" marker-end="url(#arrowhead)" stroke="#475569" stroke-dasharray="6,4" stroke-width="1.5"></path>
            </svg>

            <div class="node-start" style="left: 92px; top: 344px;"></div>

            <div class="diag-box state-idle" style="left: 180px; top: 320px; width: 160px; height: 80px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-pause-circle text-gray-400"></i>
                    <h3 class="text-white font-bold text-sm uppercase tracking-wide">Idle</h3>
                </div>
                <p class="text-gray-400 text-[10px] mt-1">Waiting for input</p>
            </div>

            <div class="transition-label" style="left: 355px; top: 330px;">
                startScan()
            </div>

            <div class="diag-box state-scanning" style="left: 440px; top: 320px; width: 160px; height: 80px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-radar text-blue-400 animate-pulse"></i>
                    <h3 class="text-white font-bold text-sm uppercase tracking-wide">Scanning</h3>
                </div>
                <p class="text-blue-200 text-[10px] mt-1">Tools Running</p>
            </div>

            <div class="transition-label" style="left: 620px; top: 330px;">
                scanDone
            </div>

            <div class="diag-box state-analyzing" style="left: 700px; top: 320px; width: 160px; height: 80px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-brain text-yellow-400"></i>
                    <h3 class="text-white font-bold text-sm uppercase tracking-wide">Analyzing</h3>
                </div>
                <p class="text-yellow-200 text-[10px] mt-1">Processing Data</p>
            </div>

            <div class="transition-label" style="left: 875px; top: 330px;">
                analysisDone
            </div>

            <div class="diag-box state-report" style="left: 960px; top: 320px; width: 160px; height: 80px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-file-contract text-purple-400"></i>
                    <h3 class="text-white font-bold text-sm uppercase tracking-wide">Report Ready</h3>
                </div>
                <p class="text-purple-200 text-[10px] mt-1">PDF Generated</p>
            </div>

            <div class="transition-label" style="left: 580px; top: 505px;">
                reset() / newScan()
            </div>

            <div class="node-end" style="left: 1180px; top: 344px;">
                <div class="node-end-inner"></div>
            </div>

            <div class="absolute bottom-6 right-6 p-4 bg-gray-900 bg-opacity-90 border border-gray-700 rounded-lg w-64 shadow-xl backdrop-filter blur-sm">
                <h4 class="text-gray-400 text-[10px] font-bold uppercase mb-2 tracking-wider">State Legend</h4>
                <div class="space-y-2">
                    <div class="flex items-center">
                        <div class="w-3 h-3 bg-blue-500 bg-opacity-50 border border-blue-400 rounded-full mr-2"></div>
                        <p class="text-gray-300 text-xs">Active Process</p>
                    </div>
                    <div class="flex items-center">
                        <div class="w-3 h-3 bg-yellow-500 bg-opacity-50 border border-yellow-400 rounded-full mr-2"></div>
                        <p class="text-gray-300 text-xs">Data Processing</p>
                    </div>
                    <div class="flex items-center">
                        <div class="w-3 h-3 bg-purple-500 bg-opacity-50 border border-purple-400 rounded-full mr-2"></div>
                        <p class="text-gray-300 text-xs">Output State</p>
                    </div>
                </div>
            </div>

        </main>

        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 z-40"></div>

    </div>
</div>

<script>
    function scaleSlide() {
        const slide = document.getElementById('slide-container');
        const scaler = document.getElementById('scaler');
        const targetWidth = 1280;
        const targetHeight = 720;
        
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;
        
        const scale = Math.min(winWidth / targetWidth, winHeight / targetHeight);
        scaler.style.transform = `scale(${scale})`;
    }
    
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('DOMContentLoaded', scaleSlide);
</script>

</body>
</html>
