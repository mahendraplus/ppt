<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slide 21 - UI Screens Gallery</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    /* 1. Viewport Reset */
    body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #050a14;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    /* 2. Scaler Wrapper */
    #scaler {
        transform-origin: center center;
        transition: transform 0.2s ease-out;
    }

    /* 3. Fixed Slide Container (1280x720) */
    #slide-container {
        position: relative;
        width: 1280px;
        height: 720px;
        background-color: #0B1120;
        box-shadow: 0 0 100px rgba(0,0,0,0.8);
        overflow: hidden;
    }

    .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Grid Pattern */
    .bg-grid {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        position: absolute; inset: 0; z-index: 0;
    }

    /* Screenshot Placeholder Frame */
    .screenshot-frame {
        background-color: rgba(30, 41, 59, 0.3);
        border: 2px dashed rgba(75, 85, 99, 0.5);
        transition: all 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
    }
    .screenshot-frame:hover {
        background-color: rgba(30, 41, 59, 0.5);
        border-color: rgba(16, 185, 129, 0.5);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        transform: translateY(-2px);
    }

    /* Caption Badge */
    .caption-badge {
        background-color: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(55, 65, 81, 1);
    }
</style>
</head>
<body>

<div id="scaler">
    <div id="slide-container">
        
        <div class="bg-grid"></div>
        <div class="absolute top-0 right-0 w-96 h-96 bg-green-900 opacity-5 rounded-full filter blur-3xl z-0 transform translate-x-32 -translate-y-32"></div>
        <div class="absolute bottom-0 left-0 w-64 h-64 bg-blue-900 opacity-5 rounded-full filter blur-3xl z-0 transform -translate-x-16 translate-y-16"></div>
        
        <header class="absolute top-0 left-0 w-full px-16 pt-10 pb-4 flex justify-between items-end border-b border-gray-800 bg-opacity-90 bg-[#0B1120] z-20" style="height: 100px;">
            <div>
                <div class="flex items-center space-x-2 mb-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                    <p class="text-green-400 text-xs font-mono uppercase tracking-widest">Interface Design</p>
                </div>
                <h1 class="text-3xl font-heading font-bold text-white">User Interface Screens</h1>
            </div>
            <div class="text-right">
                <p class="text-gray-500 font-mono text-sm">SPCE / MCA / SEM-IV</p>
            </div>
        </header>

        <main class="absolute left-0 w-full px-16 py-8 flex flex-col z-10" style="top: 100px; bottom: 20px;">
            
            <div class="grid grid-cols-2 grid-rows-2 gap-x-8 gap-y-6 h-full">
                
                <div class="flex flex-col h-full group">
                    <div class="screenshot-frame flex-1 rounded-xl relative mb-2">
                        <div class="text-center z-10">
                            <i class="fas fa-lock text-3xl text-gray-600 mb-2 group-hover:text-green-400 transition-colors"></i>
                            <p class="text-gray-500 font-mono text-xs uppercase tracking-wide">Login Screen</p>
                            <p class="text-gray-600 text-[10px] mt-1">Auth Portal</p>
                        </div>
                        <div class="absolute top-3 left-3 right-3 h-1 bg-gray-700 rounded opacity-20"></div>
                        <div class="absolute top-6 left-3 w-1/3 h-1 bg-gray-700 rounded opacity-20"></div>
                    </div>
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center space-x-2">
                            <span class="w-5 h-5 rounded bg-gray-800 flex items-center justify-center text-[10px] font-mono text-green-400 border border-gray-700">01</span>
                            <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wide">Login</h3>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col h-full group">
                    <div class="screenshot-frame flex-1 rounded-xl relative mb-2">
                        <div class="text-center z-10">
                            <i class="fas fa-chart-line text-3xl text-gray-600 mb-2 group-hover:text-blue-400 transition-colors"></i>
                            <p class="text-gray-500 font-mono text-xs uppercase tracking-wide">Dashboard</p>
                            <p class="text-gray-600 text-[10px] mt-1">Analytics View</p>
                        </div>
                        <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-gray-700 opacity-20"></div>
                        <div class="absolute bottom-3 left-3 right-3 h-1/4 bg-gray-700 rounded opacity-10"></div>
                    </div>
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center space-x-2">
                            <span class="w-5 h-5 rounded bg-gray-800 flex items-center justify-center text-[10px] font-mono text-blue-400 border border-gray-700">02</span>
                            <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wide">Main Dash</h3>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col h-full group">
                    <div class="screenshot-frame flex-1 rounded-xl relative mb-2">
                        <div class="text-center z-10">
                            <i class="fas fa-crosshairs text-3xl text-gray-600 mb-2 group-hover:text-red-400 transition-colors"></i>
                            <p class="text-gray-500 font-mono text-xs uppercase tracking-wide">Scan Config</p>
                            <p class="text-gray-600 text-[10px] mt-1">Target Input</p>
                        </div>
                        <div class="absolute top-1/2 left-4 right-4 h-6 bg-gray-700 rounded opacity-20 transform -translate-y-1/2"></div>
                    </div>
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center space-x-2">
                            <span class="w-5 h-5 rounded bg-gray-800 flex items-center justify-center text-[10px] font-mono text-red-400 border border-gray-700">03</span>
                            <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wide">New Scan</h3>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col h-full group">
                    <div class="screenshot-frame flex-1 rounded-xl relative mb-2">
                        <div class="text-center z-10">
                            <i class="fas fa-list-ul text-3xl text-gray-600 mb-2 group-hover:text-purple-400 transition-colors"></i>
                            <p class="text-gray-500 font-mono text-xs uppercase tracking-wide">Scan Results</p>
                            <p class="text-gray-600 text-[10px] mt-1">Findings List</p>
                        </div>
                        <div class="absolute top-3 left-3 right-3 space-y-2">
                            <div class="h-1 bg-gray-700 rounded opacity-20 w-full"></div>
                            <div class="h-1 bg-gray-700 rounded opacity-20 w-full"></div>
                            <div class="h-1 bg-gray-700 rounded opacity-20 w-3/4"></div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center space-x-2">
                            <span class="w-5 h-5 rounded bg-gray-800 flex items-center justify-center text-[10px] font-mono text-purple-400 border border-gray-700">04</span>
                            <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wide">Results</h3>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-green-500 via-blue-500 to-purple-500 z-40"></div>

    </div>
</div>

<script>
    function scaleSlide() {
        const slide = document.getElementById('slide-container');
        const scaler = document.getElementById('scaler');
        const targetWidth = 1280;
        const targetHeight = 720;
        
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;
        
        const scale = Math.min(winWidth / targetWidth, winHeight / targetHeight);
        scaler.style.transform = `scale(${scale})`;
    }
    
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('DOMContentLoaded', scaleSlide);
</script>

</body>
</html>
