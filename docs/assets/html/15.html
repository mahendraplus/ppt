<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slide 15 - Use Case Diagram</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    /* 1. Viewport Reset */
    body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #050a14;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    /* 2. Scaler Wrapper */
    #scaler {
        transform-origin: center center;
        transition: transform 0.2s ease-out;
    }

    /* 3. Fixed Slide Container (1280x720) */
    #slide-container {
        position: relative;
        width: 1280px;
        height: 720px;
        background-color: #0B1120;
        box-shadow: 0 0 100px rgba(0,0,0,0.8);
        overflow: hidden;
    }

    .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Grid Pattern */
    .bg-grid {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        position: absolute; inset: 0; z-index: 0;
    }

    /* Use Case Elements */
    .actor-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 30;
        position: absolute;
        width: 140px; /* Fixed width for centering */
    }
    
    .use-case-oval {
        background-color: rgba(30, 41, 59, 0.95);
        border: 2px solid rgba(59, 130, 246, 0.5);
        backdrop-filter: blur(8px);
        border-radius: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 20px;
        position: absolute;
        z-index: 30;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        width: 240px;
        height: 50px;
    }

    .use-case-oval:hover {
        border-color: rgba(16, 185, 129, 0.8);
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        background-color: rgba(30, 41, 59, 1);
        cursor: default;
    }

    .system-boundary {
        position: absolute;
        border: 2px solid rgba(148, 163, 184, 0.3);
        background-color: rgba(15, 23, 42, 0.4);
        border-radius: 1rem;
        z-index: 5;
    }

    .system-label {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #0B1120;
        padding: 0 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.9rem;
        color: #94a3b8;
        font-weight: 700;
        letter-spacing: 0.05em;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 4px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    /* Connection Lines */
    svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 10;
        pointer-events: none;
    }
</style>
</head>
<body>

<div id="scaler">
    <div id="slide-container">
        
        <div class="bg-grid"></div>
        <div class="absolute top-0 right-0 w-1/2 h-full bg-blue-900 opacity-10 transform skew-x-12 origin-top-right translate-x-32 z-0"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-900 opacity-10 rounded-full filter blur-3xl z-0"></div>

        <header class="absolute top-0 left-0 w-full px-16 pt-10 pb-4 flex justify-between items-end border-b border-gray-800 bg-opacity-90 bg-[#0B1120] z-30" style="height: 100px;">
            <div>
                <div class="flex items-center space-x-2 mb-1">
                    <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                    <p class="text-blue-400 text-xs font-mono uppercase tracking-widest">UML Modeling</p>
                </div>
                <h1 class="text-4xl font-heading font-bold text-white">Use Case Diagram</h1>
            </div>
            <div class="text-right">
                <p class="text-gray-500 font-mono text-sm">Security Audit System</p>
            </div>
        </header>

        <main class="absolute top-0 left-0 w-full h-full z-10">
            
            <svg>
                <line stroke="#64748b" stroke-width="1.5" x1="220" y1="330" x2="580" y2="205" />
                
                <line stroke="#64748b" stroke-width="1.5" x1="220" y1="330" x2="580" y2="295" />
                
                <line stroke="#64748b" stroke-width="1.5" x1="220" y1="330" x2="580" y2="385" />
                
                <line stroke="#64748b" stroke-width="1.5" x1="220" y1="330" x2="580" y2="475" />
                
                <line stroke="#64748b" stroke-width="1.5" x1="220" y1="330" x2="580" y2="565" />
            </svg>

            <div class="actor-box" style="top: 300px; left: 150px;">
                <div class="mb-3 p-3 bg-blue-900 bg-opacity-20 rounded-full border border-blue-500/30 flex items-center justify-center w-16 h-16">
                    <i class="fas fa-user-secret text-3xl text-blue-400"></i>
                </div>
                <h3 class="text-white font-bold text-sm font-heading">Security Auditor</h3>
                <p class="text-blue-300 text-[10px] mt-1 font-mono tracking-wide">PRIMARY ACTOR</p>
            </div>

            <div class="system-boundary" style="top: 140px; left: 450px; width: 500px; height: 490px;">
                <div class="system-label">Web Application Boundary</div>
            </div>

            <div class="use-case-oval" style="top: 180px; left: 580px;">
                <p class="text-white font-medium text-sm">Authentication (Login)</p>
            </div>

            <div class="use-case-oval" style="top: 270px; left: 580px;">
                <p class="text-white font-medium text-sm">Manage Scan Targets</p>
            </div>

            <div class="use-case-oval" style="top: 360px; left: 580px;">
                <p class="text-white font-medium text-sm">Execute Security Scan</p>
            </div>

            <div class="use-case-oval" style="top: 450px; left: 580px;">
                <p class="text-white font-medium text-sm">View Analysis Results</p>
            </div>

            <div class="use-case-oval" style="top: 540px; left: 580px;">
                <p class="text-white font-medium text-sm">Generate Audit Report</p>
            </div>

            <div class="absolute bottom-6 right-6 p-4 bg-gray-900 bg-opacity-90 border border-gray-700 rounded-lg w-56 shadow-xl backdrop-filter blur-sm z-40">
                <h4 class="text-gray-400 text-[10px] font-bold uppercase mb-2 tracking-wider">Legend</h4>
                <div class="space-y-2">
                    <div class="flex items-center">
                        <span class="w-8 h-0.5 bg-gray-400 mr-2"></span>
                        <p class="text-gray-300 text-xs">Association</p>
                    </div>
                    <div class="flex items-center">
                        <div class="w-3 h-3 rounded-full border border-blue-500 mr-2"></div>
                        <p class="text-gray-300 text-xs">Use Case</p>
                    </div>
                    <div class="flex items-center">
                        <div class="w-3 h-3 border border-gray-500 rounded mr-2"></div>
                        <p class="text-gray-300 text-xs">System Boundary</p>
                    </div>
                </div>
            </div>

        </main>

        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 z-40"></div>

    </div>
</div>

<script>
    function scaleSlide() {
        const slide = document.getElementById('slide-container');
        const scaler = document.getElementById('scaler');
        const targetWidth = 1280;
        const targetHeight = 720;
        
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;
        
        const scale = Math.min(winWidth / targetWidth, winHeight / targetHeight);
        scaler.style.transform = `scale(${scale})`;
    }
    
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('DOMContentLoaded', scaleSlide);
</script>

</body>
</html>
