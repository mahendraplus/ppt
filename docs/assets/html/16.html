<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slide 16 - Sequence Diagram</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    /* 1. Viewport Reset */
    body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #050a14;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    /* 2. Scaler Wrapper */
    #scaler {
        transform-origin: center center;
        transition: transform 0.2s ease-out;
    }

    /* 3. Fixed Slide Container (1280x720) */
    #slide-container {
        position: relative;
        width: 1280px;
        height: 720px;
        background-color: #0B1120;
        box-shadow: 0 0 100px rgba(0,0,0,0.8);
        overflow: hidden;
    }

    .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Grid Pattern */
    .bg-grid {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        position: absolute; inset: 0; z-index: 0;
    }

    /* Diagram Box Styling */
    .diag-box {
        background-color: rgba(30, 41, 59, 0.95);
        border: 2px solid rgba(71, 85, 105, 0.6);
        backdrop-filter: blur(4px);
        box-shadow: 0 8px 12px -3px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        z-index: 20;
    }
    
    /* Lifeline Specific Colors */
    .box-user { border-color: rgba(59, 130, 246, 0.5); }
    .box-webapp { border-color: rgba(16, 185, 129, 0.5); }
    .box-scanner { border-color: rgba(239, 68, 68, 0.5); }
    .box-db { border-color: rgba(245, 158, 11, 0.5); }

    /* Lifeline Vertical Line */
    .lifeline {
        position: absolute;
        top: 60px; /* Starts just below boxes */
        bottom: 0px;
        width: 2px;
        background: rgba(148, 163, 184, 0.15);
        border-right: 2px dashed rgba(148, 163, 184, 0.3);
        z-index: 5;
        transform: translateX(-50%);
    }

    /* Activation Bars */
    .activation {
        position: absolute;
        width: 14px;
        background-color: rgba(30, 41, 59, 0.8);
        border: 1px solid;
        z-index: 15;
        transform: translateX(-50%);
        border-radius: 2px;
    }

    /* Message Labels */
    .msg-label {
        position: absolute;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: #e2e8f0;
        background-color: #0B1120;
        padding: 2px 8px;
        border-radius: 4px;
        z-index: 25;
        white-space: nowrap;
        border: 1px solid rgba(148, 163, 184, 0.3);
    }

    /* Connections Layer */
    svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 10;
        pointer-events: none;
    }
    .arrow-line {
        stroke: #94a3b8;
        stroke-width: 1.5;
    }
    .arrow-dashed {
        stroke-dasharray: 6,4;
    }
</style>
</head>
<body>

<div id="scaler">
    <div id="slide-container">
        
        <div class="bg-grid"></div>
        <div class="absolute top-0 right-0 w-1/2 h-full bg-blue-900 opacity-10 transform skew-x-12 origin-top-right translate-x-32 z-0"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-900 opacity-10 rounded-full filter blur-3xl z-0"></div>

        <header class="absolute top-0 left-0 w-full px-16 pt-10 pb-4 flex justify-between items-end border-b border-gray-800 bg-opacity-90 bg-[#0B1120] z-30 h-[100px]">
            <div>
                <div class="flex items-center space-x-2 mb-1">
                    <span class="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></span>
                    <p class="text-purple-400 text-xs font-mono uppercase tracking-widest">UML Design</p>
                </div>
                <h1 class="text-4xl font-heading font-bold text-white">Sequence Diagram</h1>
            </div>
            <div class="text-right">
                <p class="text-gray-500 font-mono text-sm">Scan Execution Flow</p>
            </div>
        </header>

        <main class="absolute left-0 w-full z-10" style="top: 130px; bottom: 0;">
            
            <svg>
                <defs>
                    <marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
                        <polygon fill="#94a3b8" points="0 0, 10 3.5, 0 7"></polygon>
                    </marker>
                    <marker id="arrowhead-open" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
                        <polyline fill="none" points="0 0, 10 3.5, 0 7" stroke="#94a3b8" stroke-width="1.5"></polyline>
                    </marker>
                </defs>

                <line class="arrow-line" marker-end="url(#arrowhead)" x1="160" y1="90" x2="444" y2="90"></line>
                
                <line class="arrow-line" marker-end="url(#arrowhead)" x1="456" y1="150" x2="774" y2="150"></line>
                
                <path class="arrow-line" d="M786 190 L826 190 L826 220 L786 220" fill="none" marker-end="url(#arrowhead)"></path>
                
                <line class="arrow-line arrow-dashed" marker-end="url(#arrowhead-open)" x1="774" y1="260" x2="456" y2="260"></line>
                
                <line class="arrow-line" marker-end="url(#arrowhead)" x1="456" y1="320" x2="1104" y2="320"></line>
                
                <line class="arrow-line arrow-dashed" marker-end="url(#arrowhead-open)" x1="1104" y1="360" x2="456" y2="360"></line>
                
                <line class="arrow-line arrow-dashed" marker-end="url(#arrowhead-open)" x1="444" y1="420" x2="160" y2="420"></line>
                
                <line class="arrow-line" marker-end="url(#arrowhead)" x1="160" y1="480" x2="444" y2="480"></line>
            </svg>

            <div class="diag-box box-user" style="top: 10px; left: 100px; width: 120px; height: 50px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-user text-blue-400"></i>
                    <span class="text-white font-bold text-sm">User</span>
                </div>
            </div>

            <div class="diag-box box-webapp" style="top: 10px; left: 390px; width: 120px; height: 50px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-desktop text-green-400"></i>
                    <span class="text-white font-bold text-sm">Web App</span>
                </div>
            </div>

            <div class="diag-box box-scanner" style="top: 10px; left: 720px; width: 120px; height: 50px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-bug text-red-400"></i>
                    <span class="text-white font-bold text-sm">Scanner</span>
                </div>
            </div>

            <div class="diag-box box-db" style="top: 10px; left: 1050px; width: 120px; height: 50px;">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-database text-yellow-400"></i>
                    <span class="text-white font-bold text-sm">Database</span>
                </div>
            </div>

            <div class="lifeline" style="left: 160px; height: 480px;"></div>
            <div class="lifeline" style="left: 450px; height: 480px;"></div>
            <div class="lifeline" style="left: 780px; height: 480px;"></div>
            <div class="lifeline" style="left: 1110px; height: 480px;"></div>

            <div class="activation border-blue-500" style="left: 160px; top: 80px; height: 410px;"></div>
            
            <div class="activation border-green-500" style="left: 450px; top: 85px; height: 400px;"></div>
            
            <div class="activation border-red-500" style="left: 780px; top: 140px; height: 130px;"></div>
            
            <div class="activation border-yellow-500" style="left: 1110px; top: 310px; height: 60px;"></div>

            <div class="msg-label" style="top: 70px; left: 230px;">1. Initiate Scan</div>
            <div class="msg-label" style="top: 130px; left: 540px;">2. Trigger Tools</div>
            <div class="msg-label" style="top: 185px; left: 840px;">3. Probe Target</div>
            <div class="msg-label" style="top: 240px; left: 540px;">4. Return Raw Data</div>
            <div class="msg-label" style="top: 300px; left: 700px;">5. Parse &amp; Save</div>
            <div class="msg-label" style="top: 340px; left: 700px;">6. Confirm</div>
            <div class="msg-label" style="top: 400px; left: 230px;">7. Notify Complete</div>
            <div class="msg-label" style="top: 460px; left: 230px;">8. Get Report</div>

        </main>

        <div class="absolute bottom-6 right-6 p-4 bg-gray-900 bg-opacity-95 border border-gray-700 rounded-lg w-60 shadow-2xl backdrop-filter blur-md z-50">
            <h4 class="text-gray-400 text-[10px] font-bold uppercase mb-3 tracking-wider">Sequence Legend</h4>
            <div class="space-y-2">
                <div class="flex items-center">
                    <span class="w-8 h-0.5 bg-gray-400 mr-3"></span>
                    <p class="text-gray-300 text-xs">Sync Message</p>
                </div>
                <div class="flex items-center">
                    <span class="w-8 h-0.5 border-t border-dashed border-gray-400 mr-3"></span>
                    <p class="text-gray-300 text-xs">Return Message</p>
                </div>
                <div class="flex items-center">
                    <div class="w-3 h-6 border border-gray-500 bg-gray-800 mr-3"></div>
                    <p class="text-gray-300 text-xs">Activation Bar</p>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 z-40"></div>

    </div>
</div>

<script>
    function scaleSlide() {
        const slide = document.getElementById('slide-container');
        const scaler = document.getElementById('scaler');
        const targetWidth = 1280;
        const targetHeight = 720;
        
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;
        
        const scale = Math.min(winWidth / targetWidth, winHeight / targetHeight);
        scaler.style.transform = `scale(${scale})`;
    }
    
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('DOMContentLoaded', scaleSlide);
</script>

</body>
</html>
