<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slide 15 - Use Case Diagram</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #0B1120;
        }
        .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Grid Pattern */
        .bg-grid {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* Use Case Styling */
        .actor-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            position: absolute;
        }
        
        .use-case-oval {
            background-color: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(59, 130, 246, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 20px;
            position: absolute;
            z-index: 20;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            width: 200px;
            height: 80px;
        }

        .use-case-oval:hover {
            border-color: rgba(16, 185, 129, 0.6);
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .system-boundary {
            position: absolute;
            border: 2px solid rgba(148, 163, 184, 0.3);
            background-color: rgba(15, 23, 42, 0.4);
            border-radius: 0.5rem;
            z-index: 5;
        }

        .system-label {
            position: absolute;
            top: -14px;
            left: 20px;
            background-color: #0B1120;
            padding: 0 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.05em;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        /* Connection Lines */
        .connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body class="w-[1280px] h-[720px] text-white bg-grid relative flex flex-col">
<!-- Header Area -->
<header class="relative z-30 px-16 pt-12 pb-4 flex justify-between items-end border-b border-gray-800 bg-opacity-90 bg-[#0B1120]">
<div>
<div class="flex items-center space-x-2 mb-2">
<span class="w-2 h-2 bg-blue-500 rounded-full"></span>
<p class="text-blue-400 text-xs font-mono uppercase tracking-widest">UML Modeling</p>
</div>
<h1 class="text-4xl font-heading font-bold text-white">Use Case Diagram</h1>
</div>
<div class="text-right">
<p class="text-gray-500 font-mono text-sm">Security Audit System</p>
</div>
</header>
<!-- Main Content / Diagram Area -->
<main class="relative z-10 flex flex-1 w-full h-full overflow-hidden bg-[#0B1120]">
<!-- SVG Connections Layer -->
<svg class="connections-layer">
<!-- Lines from Actor to Use Cases -->
<!-- Login -->
<line stroke="#64748b" stroke-width="2" x1="220" x2="480" y1="360" y2="150"></line>
<!-- Manage Targets -->
<line stroke="#64748b" stroke-width="2" x1="220" x2="480" y1="360" y2="250"></line>
<!-- Execute Scan -->
<line stroke="#64748b" stroke-width="2" x1="220" x2="480" y1="360" y2="350"></line>
<!-- View Results -->
<line stroke="#64748b" stroke-width="2" x1="220" x2="480" y1="360" y2="450"></line>
<!-- Generate Report -->
<line stroke="#64748b" stroke-width="2" x1="220" x2="480" y1="360" y2="550"></line>
</svg>
<!-- Diagram Container -->
<div class="relative w-full h-full">
<!-- Actor: Security Auditor -->
<div class="actor-box" style="top: 280px; left: 140px;">
<div class="text-blue-400 mb-2">
<svg class="h-24 w-24" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</div>
<h3 class="text-white font-bold text-lg font-heading">Security Auditor</h3>
<p class="text-blue-200 text-xs mt-1 bg-blue-900 bg-opacity-30 px-2 py-1 rounded">Primary Actor</p>
</div>
<!-- System Boundary -->
<div class="system-boundary" style="top: 80px; left: 420px; width: 600px; height: 550px;">
<div class="system-label">Security Audit System</div>
</div>
<!-- Use Cases -->
<!-- Use Case 1: Login -->
<div class="use-case-oval" style="top: 110px; left: 620px;">
<p class="text-white font-medium text-sm">Login</p>
</div>
<!-- Use Case 2: Manage Targets -->
<div class="use-case-oval" style="top: 210px; left: 620px;">
<p class="text-white font-medium text-sm">Manage Targets</p>
</div>
<!-- Use Case 3: Execute Scan -->
<div class="use-case-oval" style="top: 310px; left: 620px;">
<p class="text-white font-medium text-sm">Execute Scan</p>
</div>
<!-- Use Case 4: View Results -->
<div class="use-case-oval" style="top: 410px; left: 620px;">
<p class="text-white font-medium text-sm">View Results</p>
</div>
<!-- Use Case 5: Generate Report -->
<div class="use-case-oval" style="top: 510px; left: 620px;">
<p class="text-white font-medium text-sm">Generate Report</p>
</div>
<!-- Legend/Notes -->
<div class="absolute bottom-6 right-6 p-4 bg-gray-900 bg-opacity-80 border border-gray-700 rounded-lg w-64">
<h4 class="text-gray-400 text-xs font-bold uppercase mb-2">Legend</h4>
<div class="space-y-2">
<div class="flex items-center">
<span class="w-8 h-0.5 bg-gray-400 mr-2"></span>
<p class="text-gray-300 text-xs">Association</p>
</div>
<div class="flex items-center">
<div class="w-3 h-3 rounded-full border border-blue-500 mr-2"></div>
<p class="text-gray-300 text-xs">Use Case</p>
</div>
<div class="flex items-center">
<div class="w-3 h-3 border border-gray-500 rounded mr-2"></div>
<p class="text-gray-300 text-xs">System Boundary</p>
</div>
</div>
</div>
</div>
</main>
<!-- Footer Stripe -->
<div class="h-1 w-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
</body>
</html>
